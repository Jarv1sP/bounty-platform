{% extends 'base.html' %}{% from 'components/medal.html' import medal with context %}{% block content %}<a class="back" href="{{ url_for('index') }}">← 返回任务大厅</a><div class="page-heading"><div><h1>发布任务</h1></div></div><form method="post" class="panel editor"><input type="hidden" name="csrf" value="{{ session.csrf }}"><div class="section-title"><span class="step-number">1</span><h2>基本信息</h2></div><label>任务标题<input name="title" required maxlength="120" placeholder="例如：整理团队新成员入门指南" value="{{ request.form.get('title','') }}"></label><div class="form-grid"><label>分类<select name="category">{% for c in categories %}<option {{ 'selected' if request.form.get('category')==c }}>{{ c }}</option>{% endfor %}</select></label><label>截止时间（UTC）<input type="datetime-local" name="deadline" required value="{{ request.form.get('deadline','') }}"><small>使用 UTC 时间，当前为 {{ current_time|date }}。</small></label></div><label>任务说明<textarea name="description" required maxlength="10000" rows="5" placeholder="背景、需要完成的工作，以及可用的参考资料">{{ request.form.get('description','') }}</textarea></label><div class="section-title"><span class="step-number">2</span><h2>交付要求</h2></div><label>交付要求<textarea name="requirements" required maxlength="10000" rows="4" placeholder="成果格式、验收标准；支持文字和链接">{{ request.form.get('requirements','') }}</textarea></label><div class="section-title"><span class="step-number">3</span><h2>任务分量与勋章</h2></div><div class="form-grid"><label>任务分量<select name="importance" id="importance" required>{% for key,label in importance_labels.items() %}<option value="{{ key }}" {{ 'selected' if request.form.get('importance','standard')==key }}>{{ label }}</option>{% endfor %}</select><small>轻量：小项协助；常规：独立交付；重要：关键事项。</small></label><label>紧急程度<select name="urgency" id="urgency" required>{% for key,label in urgency_labels.items() %}<option value="{{ key }}" {{ 'selected' if request.form.get('urgency','normal')==key }}>{{ label }}</option>{% endfor %}</select></label></div><div class="medal-previews" aria-live="polite" aria-atomic="true">{% for key,item in medals.items() %}<div class="medal-preview" data-medal="{{ key }}" {% if key != request.form.get('importance','standard') ~ '-' ~ request.form.get('urgency','normal') %}hidden{% endif %}>{{ medal(key,'large') }}<div><small>任务勋章</small><h3>{{ item.name }}</h3><p>验收通过后授予认领人。</p></div></div>{% endfor %}</div><noscript><p class="hint">勋章将按所选分量和紧急程度分配，发布后可在任务详情中查看。</p></noscript><div class="form-actions"><a class="button secondary" href="{{ url_for('index') }}">取消</a><button class="primary">发布任务 {{ icon('arrow') }}</button></div></form>{% endblock %}
