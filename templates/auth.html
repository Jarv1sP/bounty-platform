{% extends 'base.html' %}{% from 'components/friend.html' import friend %}{% block content %}<div class="auth-layout"><div class="auth-friend">{{ friend() }}</div><section class="panel"><h1>{{ '创建团队账号' if mode=='register' else '登录' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>用户名<input name="name" required maxlength="40" autocomplete="username" value="{{ request.form.get('name','') }}"></label><label>密码<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="{{ 'new-password' if mode=='register' else 'current-password' }}" placeholder="至少 8 个字符"></label><button class="primary wide">{{ '注册并进入' if mode=='register' else '登录' }}</button></form><p class="muted">{{ '已有账号？' if mode=='register' else '第一次使用？' }} <a href="{{ url_for('auth',mode='login' if mode=='register' else 'register') }}">{{ '去登录' if mode=='register' else '创建账号' }}</a></p></section></div>{% endblock %}
