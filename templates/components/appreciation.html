{% macro appreciation(task_id, count, active, can_react=true, return_to='detail') -%}
{% if can_react %}<form method="post" action="{{ url_for('appreciate',task_id=task_id) }}" data-appreciate-form class="appreciation-form"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="return_to" value="{{ return_to }}"><button class="appreciate-button {{ 'is-active' if active }}" aria-pressed="{{ 'true' if active else 'false' }}"><span class="appreciate-heart" aria-hidden="true">{{ '♥' if active else '♡' }}</span><span>有帮助</span><span data-appreciate-count>{{ count }}</span></button><span class="appreciation-message" role="status"></span></form>{% else %}<span class="appreciation-self">♡ {{ count }} 位伙伴觉得有帮助</span>{% endif %}
{%- endmacro %}
