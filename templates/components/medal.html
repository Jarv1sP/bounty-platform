{% macro medal(key, size='small') -%}
{% set item = medals[key] %}<span class="medal medal-{{ size }} {{ item.tone }}" role="img" aria-label="{{ item.name }}勋章"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect class="stamp-paper" x="5" y="5" width="90" height="90" rx="22"/><rect class="stamp-outline" x="10" y="10" width="80" height="80" rx="18"/>
{% if item.symbol=='clover' %}<g class="doodle" fill="#acd8b9" stroke="#638c76"><path d="M50 49C22 48 24 24 35 25q10-1 15 13 5-14 15-13c11-1 13 23-15 24Z"/><path d="M50 49C22 50 24 74 35 73q10 1 15-13 5 14 15 13c11 1 13-23-15-24Z"/><path d="m50 49 10 29" fill="none"/></g><circle cx="41" cy="46" r="1.6" fill="#456b57"/><circle cx="57" cy="46" r="1.6" fill="#456b57"/>
{% elif item.symbol=='rice' %}<path class="doodle" d="M42 25q8-12 17 0L80 62q7 17-12 18H32Q13 79 20 62Z" fill="#fffef8" stroke="#879c8d"/><path d="M39 59q11-5 22 0v21H39Z" fill="#739583"/><circle cx="36" cy="51" r="2.2" fill="#687b6d"/><circle cx="64" cy="51" r="2.2" fill="#687b6d"/><ellipse cx="30" cy="57" rx="5" ry="2.5" fill="#f1c4bc"/><ellipse cx="70" cy="57" rx="5" ry="2.5" fill="#f1c4bc"/><path d="m48 53 2 2 2-2" fill="none" stroke="#687b6d" stroke-width="1.5"/>
{% elif item.symbol=='sakura' %}<path class="doodle" d="M30 78q17-18 18-41m-6 22 25 5" fill="none" stroke="#b19d90"/><g fill="#f0c5d1" stroke="#be8b9a" stroke-width="1.2">{% for rotation in [0,72,144,216,288] %}<path d="M49 46C24 39 28 21 40 24l6-5 5 5c15-3 19 17-2 22Z" transform="rotate({{ rotation }} 49 45) scale(.65) translate(26 24)"/>{% endfor %}</g><circle cx="49" cy="45" r="5" fill="#f3dd91"/><path class="doodle" d="M43 63q-21-9-18 6 10 10 18-6m18-1q16-15 18-3-3 12-18 3" fill="#bbd7b6" stroke="#88a38c"/>
{% elif item.symbol=='sunny' %}<path d="M50 13v7" stroke="#99aeb7" stroke-width="2"/><path class="doodle" d="m40 48-14 30 13-4 11 6 11-6 13 4-14-30" fill="#fffef8" stroke="#9eabb6"/><circle class="doodle" cx="50" cy="36" r="19" fill="#fffef8" stroke="#9eabb6"/><path d="m35 55 15 4 15-4" fill="none" stroke="#e5b4bc" stroke-width="4"/><circle cx="43" cy="34" r="1.8" fill="#7e8e9a"/><circle cx="57" cy="34" r="1.8" fill="#7e8e9a"/><path d="M45 42q5 5 10 0" fill="none" stroke="#7e8e9a" stroke-width="1.5"/><ellipse cx="37" cy="40" rx="4" ry="2" fill="#efced0"/><ellipse cx="63" cy="40" rx="4" ry="2" fill="#efced0"/>
{% elif item.symbol=='crane' %}<g class="doodle" stroke="#729aab" stroke-linejoin="round"><path d="m18 61 28-16L36 19l24 24 22-8-14 23-19 19Z" fill="#c7e0e8"/><path d="m18 61 28-16 3 32Zm28-16 14-2-11 34m11-34 22-8-14 23-19 19" fill="#a7cfdd"/><path d="m68 58 8-4 7 7-10-2-9 12" fill="#edf7f9"/></g>
{% else %}<path d="M19 62q17-27 48-35M22 76q19-31 46-37" fill="none" stroke="#b7c9e3" stroke-width="5" stroke-linecap="round"/><path d="M18 69q20-30 46-36" fill="none" stroke="#d6c9e2" stroke-width="3" stroke-linecap="round"/><path class="doodle" d="m66 19 5 11 12 2-9 9 2 12-10-6-11 6 2-12-9-9 13-2Z" fill="#f7e5a2" stroke="#c5af70"/><circle cx="63" cy="35" r="1.3" fill="#ae965b"/><circle cx="70" cy="35" r="1.3" fill="#ae965b"/>{% endif %}</svg></span>
{%- endmacro %}
